<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export to Markdown</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 720px;
      min-height: 540px;
      margin: 0;
      background: #ffffff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 16px 20px;
      border-bottom: 1px solid #dadce0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      line-height: 24px;
    }

    #status {
      max-width: 430px;
      margin: 0;
      color: #5f6368;
      font-size: 13px;
      line-height: 20px;
      text-align: right;
    }

    #status[data-state="success"] {
      color: #137333;
    }

    #status[data-state="error"] {
      color: #b3261e;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid #e8eaed;
    }

    button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid #c4c7c5;
      border-radius: 6px;
      color: #1f1f1f;
      background: #ffffff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #f8fafd;
    }

    button:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: 2px;
    }

    button:disabled {
      color: #9aa0a6;
      background: #f1f3f4;
      cursor: default;
    }

    #export-button {
      border-color: #0b57d0;
      color: #ffffff;
      background: #0b57d0;
    }

    #export-button:hover:not(:disabled) {
      background: #0842a0;
    }

    main {
      position: relative;
      height: 444px;
      padding: 16px 20px 20px;
    }

    textarea {
      display: block;
      width: 100%;
      height: 100%;
      resize: none;
      padding: 14px;
      border: 1px solid #bdc1c6;
      border-radius: 6px;
      color: #202124;
      background: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
    }

    textarea:focus {
      border-color: #0b57d0;
      outline: 1px solid #0b57d0;
    }

    #history-panel {
      height: 100%;
      overflow-y: auto;
      border-top: 1px solid #e8eaed;
    }

    #history-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #e8eaed;
    }

    .history-title,
    .history-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      font-size: 14px;
      font-weight: 600;
    }

    .history-url {
      margin-top: 4px;
      color: #5f6368;
      font-size: 12px;
    }

    .delete-history {
      min-width: 72px;
      color: #b3261e;
    }

    #empty-history {
      margin: 32px 0;
      color: #5f6368;
      text-align: center;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .78);
    }

    #loading img {
      width: 44px;
      height: 44px;
      animation: spin 1.2s linear infinite;
    }

    [hidden] {
      display: none !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Export to Markdown</h1>
    <p id="status" role="status" aria-live="polite" data-state="idle">Ready</p>
  </header>

  <nav class="toolbar" aria-label="Export actions">
    <button id="export-button" type="button">Convert current page</button>
    <button id="copy-button" type="button" disabled>Copy Markdown</button>
    <button id="history-button" type="button">History</button>
  </nav>

  <main>
    <textarea id="source" aria-label="Generated Markdown" spellcheck="false" placeholder="Markdown output"></textarea>
    <section id="history-panel" aria-label="Conversion history" hidden>
      <ul id="history-list"></ul>
      <p id="empty-history" hidden>No conversion history</p>
    </section>
    <div id="loading" hidden aria-hidden="true">
      <img src="load.svg" alt="">
    </div>
  </main>

  <script src="scripts/vendor/turndown.js"></script>
  <script src="scripts/vendor/turndown-plugin-gfm.js"></script>
  <script src="scripts/converter.js"></script>
  <script src="scripts/widget.js"></script>
</body>
</html>
